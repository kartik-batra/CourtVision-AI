{% extends 'base.html' %}
{% block title %}Forgot Password — CourtVision AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--navy);margin-bottom:1rem">
                <i class="fas fa-key"></i>
            </div>
            <div class="section-eyebrow" data-i18n="account_recovery">Account Recovery</div>
            <h2 class="section-title mb-1" data-i18n="forgot_password">Forgot Password?</h2>
            <p style="color:var(--text-muted);font-size:0.85rem;max-width:320px;margin:0 auto"
               data-i18n="forgot_password_help">
                Enter the email address linked to your account and we'll send you a reset link.
            </p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label" data-i18n="email_address">Email Address</label>
                        <div style="position:relative">
                            <i class="fas fa-envelope" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--slate);font-size:0.8rem;pointer-events:none"></i>
                            <input type="email" name="email" class="form-control"
                                   placeholder="your@email.com"
                                   style="padding-left:32px"
                                   value="{{ request.POST.email }}"
                                   required autofocus>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 py-2" data-i18n="send_reset_link">
                        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3" style="font-size:0.85rem;color:var(--text-muted)">
            <span data-i18n="remember_password">Remembered your password?</span>
            <a href="{% url 'authentication:login' %}" style="color:var(--gold);text-decoration:none;font-weight:600" data-i18n="sign_in">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
