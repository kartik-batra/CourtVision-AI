{% extends 'base.html' %}
{% block title %}Password Reset Complete — CourtVision AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh">
    <div class="col-md-5 col-lg-4 text-center">
        <div style="width:72px;height:72px;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;color:#2ecc71;margin-bottom:1.5rem">
            <i class="fas fa-check"></i>
        </div>
        <div class="section-eyebrow" style="color:#2ecc71">Success</div>
        <h2 class="section-title mb-3">Password Reset!</h2>
        <div class="card mb-4">
            <div class="card-body p-4">
                <p style="color:var(--text-muted);font-size:0.875rem;line-height:1.7;margin-bottom:0">
                    Your password has been set successfully. You can now sign in with your new password.
                </p>
            </div>
        </div>
        <a href="{% url 'authentication:login' %}" class="btn btn-gold w-100 py-2">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In Now
        </a>
    </div>
</div>
{% endblock %}
