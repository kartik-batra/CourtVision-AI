{% extends 'base.html' %}
{% block title %}Delete Note — CourtVision AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card" style="border-color:rgba(231,76,60,0.3)">
            <div class="card-header" style="background:rgba(231,76,60,0.07);border-color:rgba(231,76,60,0.3)">
                <span style="font-size:0.8rem;font-weight:600;color:#e74c3c;text-transform:uppercase;letter-spacing:1px">
                    <i class="fas fa-exclamation-triangle me-2"></i>Confirm Deletion
                </span>
            </div>
            <div class="card-body p-4 text-center">
                <div style="width:56px;height:56px;background:rgba(231,76,60,0.1);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;color:#e74c3c;margin-bottom:1rem">
                    <i class="fas fa-trash"></i>
                </div>
                <h5 style="font-family:'Playfair Display',serif;color:var(--text);margin-bottom:0.5rem">Delete this note?</h5>
                <p style="color:var(--text);font-size:0.875rem;font-weight:600;margin-bottom:0.4rem">{{ note.title }}</p>
                <p style="color:var(--text-muted);font-size:0.8rem;margin-bottom:1.5rem">This action cannot be undone.</p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" style="background:#e74c3c;color:#fff;border:none;padding:0.5rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer">
                        <i class="fas fa-trash me-2"></i>Delete
                    </button>
                    <a href="{% url 'notes:detail' note.pk %}" class="btn-ghost">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
